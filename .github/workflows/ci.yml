name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check + build
        run: npm run build
        env:
          # Dummy values so the build succeeds without real secrets.
          # This only checks that the app compiles — it doesn't run OAuth.
          GITHUB_ID: dummy
          GITHUB_SECRET: dummy
          NEXTAUTH_SECRET: dummy
          NEXTAUTH_URL: http://localhost:3000

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true # Report but don't block merges on this yet.
